[package]
name = "civilkit-calcs-docx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/mageaustralia/civilkit-calcs"
homepage = "https://github.com/mageaustralia/civilkit-calcs"
keywords = ["docx","xlsx","export","report","engineering"]
categories = ["encoding","text-processing"]
description = "Word (.docx) and Excel (.xlsx) export of CalcpadCE worksheet reports, in Rust: Office Math equations, tables, pictures and native charts"

[lib]
name = "calcpad_docx"

[features]
default = ["svg"]
# SVG images (plots, drawings) rasterised to PNG for the document with resvg, the SVG kept
# beside it for Word versions that show SVG.
svg = ["dep:resvg"]
# The CLI draws SVG text with the fonts installed on the machine.
system-fonts = ["svg", "resvg/system-fonts"]

[dependencies]
calcpad-core = { package = "civilkit-calcs-engine", path = "../calcpad-core", version = "0.1.0" }
resvg = { version = "0.45", default-features = false, features = ["text"], optional = true }
