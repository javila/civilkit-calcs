[package]
name = "calcpad-linalg-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WebAssembly binding of the engine's dense linear algebra for the Python blocks of the CivilKit Calcs web app, loaded on demand"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
calcpad-core = { package = "civilkit-calcs-engine", path = "../calcpad-core" }
# Must match the wasm-bindgen CLI used by tools/build_wasm.sh.
wasm-bindgen = "=0.2.122"
serde_json = "1"
