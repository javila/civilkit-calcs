[workspace]
resolver = "2"
members = ["calcpad-core", "calcpad-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
debug = false

# The HP comparison tests multiply and decompose 500x500 matrices; build the tests
# optimized so that `cargo test` stays fast.
[profile.test]
opt-level = 3
