[package]
name = "calcpad-docx-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WebAssembly bindings of calcpad-docx (the Word export), loaded only when a document is exported"

[lib]
crate-type = ["cdylib"]

[dependencies]
calcpad-docx = { package = "civilkit-calcs-docx", path = "../calcpad-docx" }
calcpad-core = { package = "civilkit-calcs-engine", path = "../calcpad-core" }
# Must match the wasm-bindgen CLI used by tools/build_wasm.sh.
wasm-bindgen = "=0.2.122"
serde_json = "1"
