[package]
name = "calcpad-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust port of the CalcpadCE calculation engine (Calcpad.Core)"

[features]
# Runs the vector, matrix and HP xunit classes that are still being ported
# (tools/xunit_gated.txt).
xunit_vm = []

[dependencies]
# Deflate for the PNG raster of $Map (pure Rust, no I/O, wasm compatible).
miniz_oxide = "0.8"
# The #UI {...} payload (System.Text.Json in CalcpadCE).
serde_json = "1"
