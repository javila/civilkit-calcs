[package]
name = "civilkit-calcs-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/mageaustralia/civilkit-calcs"
homepage = "https://github.com/mageaustralia/civilkit-calcs"
keywords = ["engineering","calculation","units","worksheet","wasm"]
categories = ["science","mathematics","wasm"]
description = "Calculation engine of CivilKit Calcs: a Rust port of the CalcpadCE worksheet engine (units, vectors, matrices, plots, input forms, HTML reports)"

[lib]
name = "calcpad_core"

[features]
# Runs the vector, matrix and HP xunit classes that are still being ported
# (tools/xunit_gated.txt).
xunit_vm = []

[dependencies]
# Deflate for the PNG raster of $Map (pure Rust, no I/O, wasm compatible).
miniz_oxide = "0.8"
# The #UI {...} payload (System.Text.Json in CalcpadCE).
serde_json = "1"
