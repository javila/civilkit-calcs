[package]
name = "calcpad-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WebAssembly bindings of calcpad-core for the CivilKit Calcs web app"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
calcpad-core = { package = "civilkit-calcs-engine", path = "../calcpad-core" }
# Must match the wasm-bindgen CLI used by tools/build_wasm.sh.
wasm-bindgen = "=0.2.122"
serde_json = "1"

[dev-dependencies]
calcpad-highlighter = { package = "civilkit-calcs-highlighter", path = "../calcpad-highlighter" }
