[package]
name = "calcpad-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings of calcpad-core for the CalcpadCE web editor"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
calcpad-core = { path = "../calcpad-core" }
# Must match the wasm-bindgen CLI used by tools/build_wasm.sh.
wasm-bindgen = "=0.2.122"
serde_json = "1"
