[package]
name = "calcpad-sheet-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WebAssembly binding of the sheet syntax compiler, loaded on demand by the CivilKit Calcs web app"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
calcpad-sheet = { package = "civilkit-calcs-sheet", path = "../calcpad-sheet" }
# Must match the wasm-bindgen CLI used by tools/build_wasm.sh.
wasm-bindgen = "=0.2.122"
