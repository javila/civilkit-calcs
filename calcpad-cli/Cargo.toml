[package]
name = "calcpad-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Command line front end for calcpad-core, compatible with Calcpad.Cli batch conversion"

[[bin]]
name = "Cli"
path = "src/main.rs"

[dependencies]
calcpad-core = { package = "civilkit-calcs-engine", path = "../calcpad-core" }
calcpad-docx = { package = "civilkit-calcs-docx", path = "../calcpad-docx", features = ["system-fonts"] }
