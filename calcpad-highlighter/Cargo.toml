[package]
name = "calcpad-highlighter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust port of Calcpad.Highlighter (CalcpadCE): tokenizer, linter, content resolution and snippets"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
calcpad-core = { path = "../calcpad-core" }
